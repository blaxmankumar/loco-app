name: Build LOCO Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21 (for Capacitor Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies & build web bundle
        run: |
          npm ci
          npm run build

      - name: Install Capacitor & generate Android project
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android
          npx cap sync android

      - name: Fix Kotlin stdlib duplicate class conflict & apply LOCO app icon
        run: |
          cat << 'EOF' >> android/app/build.gradle

          dependencies {
              implementation(platform("org.jetbrains.kotlin:kotlin-bom:1.8.22"))
          }
          EOF
          for dir in android/app/src/main/res/mipmap-*; do
            if [ -d "$dir" ]; then
              cp public/icon-512.png "$dir/ic_launcher.png" || true
              cp public/icon-512.png "$dir/ic_launcher_round.png" || true
              cp public/icon-512.png "$dir/ic_launcher_foreground.png" || true
            fi
          done

      - name: Build installable LOCO APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload LOCO-Android.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: LOCO-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
