name: Build LOCO Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21 (for Capacitor 7 Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies & build web bundle
        run: |
          npm ci
          npm run build

      - name: Install Capacitor 7 & generate Android project
        run: |
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap add android
          npx cap sync android

      - name: Configure Android Gradle, GPS permissions & LOCO launcher icon
        run: |
          # 1. Auto-bump Android versionCode & versionName + fix Kotlin stdlib duplicate class conflict
          node --input-type=commonjs -e '
            const fs = require("fs");
            const p = "android/app/build.gradle";
            let g = fs.readFileSync(p, "utf8");
            const runNum = Math.max(2, parseInt(process.env.GITHUB_RUN_NUMBER || "2", 10));
            g = g.replace(/versionCode\s+\d+/, "versionCode " + runNum);
            g = g.replace(/versionName\s+"[^"]+"/, "versionName \"2." + runNum + "\"");
            fs.writeFileSync(p, g, "utf8");
          '
          cat << 'EOF' >> android/app/build.gradle

          dependencies {
              implementation(platform("org.jetbrains.kotlin:kotlin-bom:1.8.22"))
          }
          EOF

          # 2. Remove adaptive-icon XML folder to prevent duplicate .xml/.png resource crash
          rm -rf android/app/src/main/res/mipmap-anydpi-v26

          # 3. Apply LOCO 512px PNG icon strictly to density mipmap folders
          for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            target="android/app/src/main/res/$dir"
            if [ -d "$target" ]; then
              cp public/icon-512.png "$target/ic_launcher.png"
              cp public/icon-512.png "$target/ic_launcher_round.png"
              rm -f "$target/ic_launcher_foreground.png"
            fi
          done

          # 4. Safely add Android GPS location permissions for Live Driver Tracking
          node --input-type=commonjs -e '
            const fs = require("fs");
            const p = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(p, "utf8");
            const perms = [
              "    <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\" />",
              "    <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\" />"
            ];
            for (const perm of perms) {
              if (!xml.includes(perm.trim())) {
                xml = xml.replace("</manifest>", perm + "\n</manifest>");
              }
            }
            fs.writeFileSync(p, xml, "utf8");
          '

          # 5. Verify launcher icons & manifest cleanly before Gradle runs
          find android/app/src/main/res -name 'ic_launcher*' | sort
          tail -n 12 android/app/build.gradle

      - name: Build installable LOCO APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload LOCO-Android.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: LOCO-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
